name = "morning-market-brief-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Secrets (wrangler secret put): TELEGRAM_TOKEN, USERS, WORKER_SHARED_SECRET
# Secrets (wrangler secret put): TELEGRAM_TOKEN, WORKER_SHARED_SECRET, OWNER_CHAT_ID, GH_DISPATCH_TOKEN
[vars]
PAGES_URL = "https://batyrkhan9.github.io/morning-market-brief"
GITHUB_REPO = "batyrkhan9/morning-market-brief"

[triggers]
# Every 15 minutes: send the latest edition to users whose local send hour has arrived.
# Build attempts after the US close (22:30, 23:30, 00:30, 01:30, 02:30 UTC): dispatch the GitHub Build workflow;
# the 02:30 run is the final attempt. Three expressions because the free plan allows 5 cron triggers per account.
crons = ["*/15 * * * *", "30 22,23 * * 1-5", "30 0-2 * * 2-6"]

[[kv_namespaces]]
binding = "KV"
id = "f9fc953b5f2d4ec4a00e8acd7da6a00f"
