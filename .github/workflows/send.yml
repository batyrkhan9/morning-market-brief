name: Send

on:
  schedule:
    - cron: "5 * * * *"   # every hour; each user gets the latest edition once their local send hour arrives
  workflow_dispatch:

concurrency:
  group: brief-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send to users who are due
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: python -m src.main --send
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Send $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
